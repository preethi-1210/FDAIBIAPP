name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
  # The production deployment calls this workflow and deploys only if every job here passes.
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q app migrations
      - name: Import check
        run: python -c "import app.main"
      # Live cache tests need a Redis-compatible server; they skip without TEST_CACHE_URL. No
      # container is started here (no Docker); Garnet tests are added after its validation.
      - name: Tests
        run: python -m pytest tests -q
      - name: Offline evaluation
        env:
          PYTHONPATH: .
        run: python -m evals.run_eval --offline

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      # The project has no ESLint configuration yet; `next build` below also type-checks.
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://www.ryzeaibiapp.com/api' }}
        run: npm run build
