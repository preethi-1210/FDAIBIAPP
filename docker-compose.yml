services:
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ryze
      POSTGRES_PASSWORD: ryze
      POSTGRES_DB: ryze_bi
    ports:
      - "5432:5432"
    volumes:
      - ryze_pg:/var/lib/postgresql/data

volumes:
  ryze_pg:
